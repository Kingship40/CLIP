<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='23 7 16 12 23 17 23 7'%3E%3C/polygon%3E%3Crect x='1' y='5' width='15' height='14' rx='2' ry='2'%3E%3C/rect%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipForge AI — Turn Long Videos Into Viral Short Clips</title>
    <meta name="description" content="Transform podcasts, interviews, tutorials, and webinars into ready-to-share vertical short clips with AI clipping workflow." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // Anti-FOUC theme initialization
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('clipforge_settings') || '{}');
          var t = s.theme || 'dark';
          if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="text/javascript">
      // GitHub Pages SPA route restoration
      (function(l) {
        if (l.search[1] === '/' || (l.search.slice(1, 4) === 'p=/')) {
          var param = l.search.slice(1);
          var path = param.indexOf('p=/') === 0 ? param.slice(2) : param;
          var decoded = path.split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            (l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
